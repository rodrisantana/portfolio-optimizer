# Visual identity inspired by serious financial portals: near-black canvas, hairline borders,
# white segmented controls, green/red reserved for market moves, Geist typeface.
[theme]
base = "dark"
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
headingFont = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap"
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "12px"
buttonRadius = "999px"
metricValueFontSize = "1.6rem"
metricValueFontWeight = 600
showWidgetBorder = true
primaryColor = "#E7E7EB"
backgroundColor = "#141519"
secondaryBackgroundColor = "#1A1B20"
textColor = "#E7E7EB"
borderColor = "#FFFFFF14"
linkColor = "#E7E7EB"
linkUnderline = false
dataframeBorderColor = "#FFFFFF12"
dataframeHeaderBackgroundColor = "#18191E"
greenColor = "#3CCB9E"
redColor = "#F0606F"
blueColor = "#5E8BFF"

[theme.sidebar]
backgroundColor = "#101115"
secondaryBackgroundColor = "#18191E"
textColor = "#E7E7EB"
borderColor = "#FFFFFF12"
primaryColor = "#E7E7EB"

[server]
headless = true

[browser]
gatherUsageStats = false
