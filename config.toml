# Configuration for the command-line run:  python main.py  (or  python main.py --config other.toml)
# Identifiers can be Yahoo tickers or ISINs (index funds are resolved automatically).

[universe]
assets = ["EUNL.DE", "IS3N.DE", "IE00B42W4L06", "LU0996182563", "VGEA.DE", "EUNA.DE", "4GLD.DE"]
base_currency = "EUR"
start = "2015-01-01"
# end = "2026-10-31"          # optional, defaults to today
backfill_funds = true         # extend short fund histories with an ETF on the same index
offline_demo = false          # true = use data/demo_prices.csv, no internet needed

[estimation]
frequency = "weekly"          # daily | weekly | monthly
expected_returns = "long_term"     # long_term | bayes_stein | historical | ewma
active_alpha = 0.0                 # extra return expected from active funds before fees
covariance = "ledoit_wolf"    # sample | ledoit_wolf | ewma
risk_free_rate = 0.026          # euro cash, J.P. Morgan 2027 LTCMA

[constraints]
max_weight = 0.5
min_weight = 0.0
# Optional asset-class limits, e.g. at least 20% in bonds:
# [[constraints.groups]]
# name = "Bonds"
# members = ["VGEA.DE", "EUNA.DE"]
# lower = 0.20
# upper = 0.60

[backtest]
lookback_years = 3
rebalance = "Quarterly"       # Monthly | Quarterly | Semi-annual | Annual
cost_bps = 10
strategies = ["Maximum Sharpe", "Minimum variance", "Risk parity", "HRP", "Equal weight"]

[montecarlo]
portfolio = "Maximum Sharpe"
initial = 10000
monthly_contribution = 300
years = 20
# expected_return = 0.06      # uncomment to override the model's long-term estimate (net of TER)
extra_costs = 0.0             # platform / custody fees; fund TERs are already in the expected return
inflation = 0.022
method = "student_t"          # lognormal | student_t | bootstrap
simulations = 10000
goal = 150000                 # in today's money
