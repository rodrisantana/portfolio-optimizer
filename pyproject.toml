[project]
name = "portfolio-optimizer"
version = "2.0.0"
description = "Portfolio optimisation, backtesting and Monte Carlo planning for ETFs, ETCs and index funds."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rodrigo Santana" }]
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.11", "yfinance>=0.2.54", "plotly>=5.22", "streamlit>=1.50"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["portfolio_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B023", "B905"]
